spring.application.name=backend

# --- Base de données ---------------------------------------------------------
# Valeurs pour lancer le back depuis l'IDE (MySQL du docker-compose sur localhost:3306).
# Dans Docker, les variables SPRING_DATASOURCE_* du docker-compose.yml les remplacent
# (l'hôte y est "mysql", le nom du service).
spring.datasource.url=jdbc:mysql://localhost:3306/alumni?serverTimezone=Europe/Paris&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=alumni_app
spring.datasource.password=alumni_app_pwd

# --- JPA / Hibernate ---------------------------------------------------------
# validate : Hibernate ne crée ni ne modifie aucune table, il vérifie que les entités
# correspondent au schéma db/init/01_schema.sql. S'il refuse de démarrer, une entité
# et le script ne sont plus d'accord : on corrige, on ne désactive pas.
spring.jpa.hibernate.ddl-auto=validate
# Pas de session ouverte jusqu'à la vue : les relations LAZY se chargent dans les services (@Transactional).
spring.jpa.open-in-view=false
# Affiche les requêtes SQL dans la console (utile pour vérifier le chargement LAZY). A couper en démo si trop verbeux.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Erreurs HTTP --------------------------------------------------------------
# Affiche le message des ResponseStatusException dans la réponse JSON (ex : "Utilisateur introuvable : 99")
server.error.include-message=always
