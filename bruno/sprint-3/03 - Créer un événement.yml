info:
  name: 03 - Créer un événement
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/events"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: "Bearer {{jetonLea}}"
    - name: Content-Type
      value: application/json
  auth: inherit
  body:
    type: json
    data: |-
      {
        "titre": "Soirée de test Bruno",
        "description": "Créée par les tests du sprint 3.",
        "categorieId": 1,
        "dateEvenement": "2030-06-15T19:00:00",
        "lieu": "Bar de test",
        "adresse": "1 rue du Test, 75013 Paris",
        "capaciteMax": 20
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Statut HTTP 201", function () {
            expect(res.getStatus()).to.equal(201);
        });

        test("L’auteur est Léa (lue dans le jeton) et la jauge est vide", function () {
            const e = res.getBody();
            expect(e.auteurId).to.equal(2);
            expect(e.nombreInscrits).to.equal(0);
            expect(e.placesRestantes).to.equal(20);
            expect(e.complet).to.equal(false);
            bru.setVar("evenementId", e.id);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Léa crée un événement : 201, auteur = l’utilisateur du jeton."
