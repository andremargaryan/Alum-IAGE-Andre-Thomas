info:
  name: 02 - Connecter l’étudiant Hugo
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/auth/login"
  headers:
    - name: Accept
      value: application/json

    - name: Content-Type
      value: application/json
  auth: inherit
  body:
    type: json
    data: |-
      {
        "email": "hugo@alumni.test",
        "motDePasse": "password"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Statut HTTP 200", function () {
            expect(res.getStatus()).to.equal(200);
        });

        test("Le jeton est rangé dans la variable", function () {
            expect(res.getBody().token).to.be.a("string");
            bru.setVar("jetonHugo", res.getBody().token);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Compte ETUDIANT des données de départ."
