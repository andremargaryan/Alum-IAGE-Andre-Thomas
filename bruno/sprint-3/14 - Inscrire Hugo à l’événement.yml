info:
  name: 14 - Inscrire Hugo à l’événement
  type: http
  seq: 14

http:
  method: POST
  url: "{{baseUrl}}/api/events/{{evenementInscriptionId}}/inscriptions"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: "Bearer {{jetonHugo}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Statut HTTP 200", function () {
            expect(res.getStatus()).to.equal(200);
        });

        test("Inscription confirmée, sans rang", function () {
            expect(res.getBody()).to.deep.equal({ statut: "INSCRIT", rang: null });
        });
