info:
  name: 12 - Consulter un événement inconnu
  type: http
  seq: 12

http:
  method: GET
  url: "{{baseUrl}}/api/events/{{idInconnu}}"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: "Bearer {{jetonHugo}}"

  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Statut HTTP 404", function () {
            expect(res.getStatus()).to.equal(404);
        });

        test("Erreur au format commun", function () {
            expect(res.getBody().chemin).to.contain("/api/events/");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Identifiant inexistant : 404 avec le format d’erreur commun (GlobalExceptionHandler)."
