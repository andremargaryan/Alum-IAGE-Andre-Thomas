info:
  name: 05 - Refuser le journal à un étudiant
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/audit"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: "Bearer {{jetonHugo}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Statut HTTP 403", function () {
            expect(res.getStatus()).to.equal(403);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Seul un ADMIN peut lire le journal."
