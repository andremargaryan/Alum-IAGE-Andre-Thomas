info:
  name: 03 - Consulter un compte supprimé
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/users/{{idSupprime}}"
  headers:
    - name: Accept
      value: application/json
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Statut HTTP 404", function () {
            expect(res.getStatus()).to.equal(404);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Le compte 8 existe en base avec le statut SUPPRIME. L’API doit répondre 404.
