info:
  name: 05 - Créer un compte
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/users"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  auth: inherit
  body:
    type: json
    data: |-
      {
        "prenom": "Camille",
        "nom": "Test",
        "email": "{{emailInscriptionTest}}",
        "motDePasse": "Essai2026!"
      }

runtime:
  scripts:
    - type: before-request
      code: |-
        const suffixe = Date.now() + "-" + Math.random().toString(36).slice(2);
        bru.setVar("emailInscriptionTest", "camille." + suffixe + "@example.test");
    - type: tests
      code: |-
        test("Statut HTTP 201", function () {
            expect(res.getStatus()).to.equal(201);
        });

        test("Le compte est actif avec le rôle ETUDIANT", function () {
            const user = res.getBody();
            expect(user.id).to.be.a("number");
            expect(user.email).to.equal(bru.getVar("emailInscriptionTest"));
            expect(user.role).to.equal("ETUDIANT");
            expect(user.statut).to.equal("ACTIF");
            expect(res.getHeader("location")).to.equal("/users/" + user.id);
        });

        test("La fiche ne contient pas de mot de passe", function () {
            expect(res.getBody()).to.not.have.property("motDePasse");
        });
