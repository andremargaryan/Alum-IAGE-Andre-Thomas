info:
  name: 02 - Consulter un compte actif
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/users/{{idActif}}"
  headers:
    - name: Accept
      value: application/json
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Statut HTTP 200", function () {
            expect(res.getStatus()).to.equal(200);
        });

        test("La fiche correspond au compte demandé", function () {
            const user = res.getBody();
            expect(user.id).to.equal(Number(bru.getCollectionVar("idActif")));
            expect(user.statut).to.equal("ACTIF");
        });

        test("La fiche ne contient pas de mot de passe", function () {
            expect(res.getBody()).to.not.have.property("motDePasse");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Le compte 1 est actif dans les données de test. Vérifie que l’API renvoie la fiche demandée sans le champ motDePasse.
