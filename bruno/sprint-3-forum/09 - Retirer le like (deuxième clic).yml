info:
  name: 09 - Retirer le like (deuxième clic)
  type: http
  seq: 9

http:
  method: POST
  url: "{{baseUrl}}/api/posts/{{sujetId}}/like"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: "Bearer {{jetonHugo}}"

  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Statut HTTP 200", function () {
            expect(res.getStatus()).to.equal(200);
        });

        test("Le like est retiré", function () {
            expect(res.getBody().aime).to.equal(false);
            expect(res.getBody().nombreLikes).to.equal(0);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Deuxième clic : la ligne est supprimée, impossible de liker deux fois."
