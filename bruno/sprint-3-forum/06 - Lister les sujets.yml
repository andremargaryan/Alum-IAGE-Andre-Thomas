info:
  name: 06 - Lister les sujets
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/api/posts"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: "Bearer {{jetonHugo}}"

  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Statut HTTP 200", function () {
            expect(res.getStatus()).to.equal(200);
        });

        test("Du plus récent au plus ancien, avec le sujet publié", function () {
            const liste = res.getBody();
            expect(liste[0].id).to.equal(Number(bru.getVar("sujetId")));
            for (let i = 1; i < liste.length; i++) {
                expect(liste[i - 1].createdAt >= liste[i].createdAt).to.equal(true);
            }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Liste triée par date de publication décroissante."
