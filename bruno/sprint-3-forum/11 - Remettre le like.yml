info:
  name: 11 - Remettre le like
  type: http
  seq: 11

http:
  method: POST
  url: "{{baseUrl}}/api/posts/3/like"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: "Bearer {{jetonHugo}}"

  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Statut HTTP 200", function () {
            expect(res.getStatus()).to.equal(200);
        });

        test("Le like est remis", function () {
            expect(res.getBody().aime).to.equal(true);
            expect(res.getBody().nombreLikes).to.equal(2);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Remet la base dans son état de départ."
