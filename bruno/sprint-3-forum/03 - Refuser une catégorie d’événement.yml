info:
  name: 03 - Refuser une catégorie d’événement
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/posts"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: "Bearer {{jetonHugo}}"
    - name: Content-Type
      value: application/json
  auth: inherit
  body:
    type: json
    data: |-
      {
        "titre": "Sujet de test Bruno",
        "description": "Publié par les tests du forum.",
        "categorieId": 1
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Statut HTTP 400", function () {
            expect(res.getStatus()).to.equal(400);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "La catégorie 1 (Soirée) est une catégorie EVENEMENT."
