info:
  name: 15 - Modifier le compte
  type: http
  seq: 16

http:
  method: PUT
  url: "{{baseUrl}}/users/{{sprint2UserId}}"
  headers:
    - name: Authorization
      value: "Bearer {{jeton}}"
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  auth: inherit
  body:
    type: json
    data: |-
      {
        "prenom": "Bruno",
        "nom": "Sprint2",
        "ville": "Lyon",
        "notificationsActives": false
      }

runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar("sprint2UserId")) {
            throw new Error("Lance d’abord la requête 01 pour créer le compte du Sprint 2.");
        }
    - type: tests
      code: |-
        test("Statut HTTP 200", function () {
            expect(res.getStatus()).to.equal(200);
        });
