info:
  name: 08 - Connecter le compte créé
  type: http
  seq: 9

http:
  method: POST
  url: "{{baseUrl}}/api/auth/login"
  headers:
    - name: Authorization
      value: "Bearer {{jeton}}"
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  auth: inherit
  body:
    type: json
    data: |-
      {
        "email": "{{sprint2Email}}",
        "motDePasse": "Sprint2Essai!"
      }

runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar("sprint2UserId")) {
            throw new Error("Lance d’abord la requête 01 pour créer le compte du Sprint 2.");
        }
    - type: tests
      code: |-
        test("Statut HTTP 200", function () {
            expect(res.getStatus()).to.equal(200);
        });

        test("Le login retrouve le compte créé", function () {
            const compte = res.getBody();
            expect(compte.userId).to.equal(Number(bru.getVar("sprint2UserId")));
            expect(compte.role).to.equal("ETUDIANT");
            expect(compte).to.not.have.property("motDePasse");
        });
