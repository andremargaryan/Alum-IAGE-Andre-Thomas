info:
  name: 14 - Refuser un parcours d’une autre université
  type: http
  seq: 14

http:
  method: POST
  url: "{{baseUrl}}/api/users/{{sprint2UserId}}/formations"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  auth: inherit
  body:
    type: json
    data: |-
      {
        "etablissementId": 2,
        "parcoursId": 1,
        "anneeDebut": 2024
      }

runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar("sprint2UserId")) {
            throw new Error("Lance d’abord la requête 01 pour créer le compte du Sprint 2.");
        }
    - type: tests
      code: |-
        test("Statut HTTP 400", function () {
            expect(res.getStatus()).to.equal(400);
        });
