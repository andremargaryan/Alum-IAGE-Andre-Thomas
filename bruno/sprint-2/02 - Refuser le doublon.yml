info:
  name: 02 - Refuser le doublon
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/users"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  auth: inherit
  body:
    type: json
    data: |-
      {
        "prenom": "Bruno",
        "nom": "Sprint2",
        "email": "{{sprint2Email}}",
        "motDePasse": "Sprint2Essai!"
      }

runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar("sprint2UserId")) {
            throw new Error("Lance d’abord la requête 01 pour créer le compte du Sprint 2.");
        }
    - type: tests
      code: |-
        test("Statut HTTP 409", function () {
            expect(res.getStatus()).to.equal(409);
        });
