info:
  name: 12 - Ajouter une formation
  type: http
  seq: 12

http:
  method: POST
  url: "{{baseUrl}}/api/users/{{sprint2UserId}}/formations"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  auth: inherit
  body:
    type: json
    data: |-
      {
        "etablissementId": 1,
        "parcoursId": 1,
        "anneeDebut": 2024
      }

runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar("sprint2UserId")) {
            throw new Error("Lance d’abord la requête 01 pour créer le compte du Sprint 2.");
        }
    - type: after-response
      code: |-
        if (res.getStatus() === 201) {
            bru.setVar("sprint2FormationId", String(res.getBody().id));
        }
    - type: tests
      code: |-
        test("Statut HTTP 201", function () {
            expect(res.getStatus()).to.equal(201);
        });
